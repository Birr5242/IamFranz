<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hobbys – Franz Barjak</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="static/css/boxfight.css" />
</head>
<body>
  <nav>
    <a href="index.html">Start</a>
    <a href="lebenslauf.html">Lebenslauf</a>
    <a href="hobbys.html">Hobbys</a>
    <a href="kontakt.html">Kontakt</a>
    <a href="video.html">Video</a>
  </nav>

  <main class="container">
    <h1>Meine Hobbys</h1>
    <p>Eines meiner liebsten Hobbys ist Boxen. Ich trainiere regelmäßig und spiele auch Gitarre.</p>
    <p>Klicke auf Start, um das Boxspiel zu beginnen.</p>

    <button id="startButton" disabled>Start (lade Assets)</button>

    <section id="gameSection" class="game-wrapper" style="display:none; margin-top:16px;">
      <div class="hud">
        <div class="player-hp">
          <div id="player-name">Du</div>
          <div class="bar"><div id="player-health" class="health"></div></div>
        </div>
        <div class="enemy-hp">
          <div id="enemy-name">Gegner</div>
          <div class="bar"><div id="enemy-health" class="health"></div></div>
        </div>
      </div>

      <canvas id="game" width="900" height="420"></canvas>

      <div class="controls">
        <div class="instructions">
          <strong>Steuerung:</strong> A/D = Links/Rechts, W = Springen, K = Schlag
        </div>

        <div class="mobile-buttons" id="mobile-buttons">
          <button class="btn" data-action="left">◀</button>
          <button class="btn" data-action="right">▶</button>
          <button class="btn" data-action="jump">↑</button>
          <button class="btn" data-action="punch">Schlag</button>
        </div>

        <button id="restart">Neustart</button>
      </div>

      <div id="message" class="message"></div>
    </section>
  </main>

  <script src="static/js/boxfight.js"></script>

  <script>
    const ASSETS = {
      // Hintergrund
      bg: "img/hintergrund.png",

      // Idle
      player_idle_1: "img/Boxanimation1-1.png",
      player_idle_2: "img/Boxanimation1-2.png",

      // Lauf
      player_run_1: "img/Laufanimation1-1.png",
      player_run_2: "img/Laufanimation1-2.png",

      // Sprung
      player_jump_1: "img/Spring-1.png",
      player_jump_2: "img/Spring-2.png",
      player_jump_3: "img/Spring-3.png",

      // Schlag
      player_punch_1: "img/Schlag-1.png",
      player_punch_2: "img/Schlag-2.png",

      // Gegner
      enemy: "img/fighter.png",

      // 🔊 Sound
      punch_sound: "sound/hit.mp3",
      bg_music: "sound/music.mp3"
    };

    function preloadImages(list) {
      const keys = Object.keys(list).filter(k => !k.includes("sound"));
      const images = {};
      let loaded = 0, failed = 0;

      return new Promise(resolve => {
        if (keys.length === 0) return resolve({images, failed});
        keys.forEach(key => {
          const img = new Image();
          img.src = list[key];
          img.onload = () => { images[key] = img; loaded++; check(); };
          img.onerror = () => { failed++; console.error("Fehler:", list[key]); check(); };
        });
        function check() { if (loaded + failed === keys.length) resolve({images, failed}); }
      });
    }

    (function () {
      const startBtn = document.getElementById("startButton");
      const gameSection = document.getElementById("gameSection");

      preloadImages(ASSETS).then(({images}) => {
        window.PRELOADED_ASSETS = { ...images, ...ASSETS };
        BoxFightInit(window.PRELOADED_ASSETS);

        startBtn.disabled = false;
        startBtn.textContent = "Start";
      });

      startBtn.addEventListener("click", () => {
        gameSection.style.display = "block";
        BoxFightStart();
      });

      document.getElementById("restart").addEventListener("click", () => {
        BoxFightRestart();
      });

      document.getElementById("mobile-buttons").addEventListener("click", ev => {
        const btn = ev.target.closest("button");
        if (!btn) return;
        BoxFightMobileAction(btn.dataset.action, true);
        setTimeout(() => BoxFightMobileAction(btn.dataset.action, false), 150);
      });
    })();
  </script>
</body>
</html>
