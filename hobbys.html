<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxfight</title>

  <style>
    body {
      background: #111;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-family: Arial;
    }
    #game {
      border: 2px solid white;
      image-rendering: pixelated;
      margin-top: 20px;
    }
    #ui {
      margin-top: 10px;
      width: 900px;
      display: flex;
      justify-content: space-between;
    }
    .hpbar {
      height: 20px;
      background: red;
      transition: 0.2s;
    }
  </style>
</head>

<body>

<h2>Boxfight Game</h2>

<canvas id="game" width="900" height="240"></canvas>

<div id="ui">
  <div style="width:45%; background:#444;">
    <div id="player-health" class="hpbar"></div>
  </div>

  <select id="difficulty">
    <option value="0.7">Leicht</option>
    <option value="1.0" selected>Mittel</option>
    <option value="1.4">Schwer</option>
  </select>

  <div style="width:45%; background:#444;">
    <div id="enemy-health" class="hpbar"></div>
  </div>
</div>

<button onclick="BoxFightStart()">Start</button>
<button onclick="BoxFightRestart()">Restart</button>

<script>
// >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
// BILDER LADEN
// >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>

const imgList = {
  bg_fertig: "img/Hintergrund_fertig.png",

  stand: "img/stand.png",
  stand_back: "img/Standrückwärts.png",

  player_run_1: "img/Laufanimation1-1.png",
  player_run_2: "img/Laufanimation1-2.png",
  player_run_1_back: "img/Laufanimationrückwärts1.png",
  player_run_2_back: "img/Laufanimationrückwärts2.png",

  player_jump_1: "img/Spring-1.png",
  player_jump_2: "img/Spring-2.png",
  player_jump_3: "img/Spring-3.png",
  player_jump_1_back: "img/Springrückwärts-1.png",
  player_jump_2_back: "img/Springrückwärts-2.png",
  player_jump_3_back: "img/Springrückwärts-3.png",

  player_punch_1: "img/Boxanimation1-1.png",
  player_punch_2: "img/Boxanimation1-2.png",
  player_punch_1_back: "img/Boxanimationrückwärts-1.png",
  player_punch_2_back: "img/Boxanimationrückwärts-2.png",

  enemy_stand: "img/Blaubox-1.png",
  enemy_stand_back: "img/Blaubox-2.png",

  enemy_run_1: "img/Laufanimationblau-1.png",
  enemy_run_2: "img/Laufanimationblau-2.png",
  enemy_run_1_back: "img/Laufanimationblau-1.png",
  enemy_run_2_back: "img/Laufanimationblau-2.png",

  enemy_jump_1: "img/Springblau-1.png",
  enemy_jump_2: "img/Springblau-2.png",
  enemy_jump_3: "img/Springblau-3.png",
  enemy_jump_1_back: "img/Springblau-1.png",
  enemy_jump_2_back: "img/Springblau-2.png",
  enemy_jump_3_back: "img/Springblau-3.png",

  enemy_punch_1: "img/Boxanimation1-1.png",
  enemy_punch_2: "img/Boxanimation1-2.png",
  enemy_punch_1_back: "img/Boxanimation1-1.png",
  enemy_punch_2_back: "img/Boxanimation1-2.png",
};

let loadedImages = {};
let loadCount = 0;
let totalImages = Object.keys(imgList).length;

for (let key in imgList) {
  let img = new Image();
  img.src = imgList[key];
  img.onload = () => {
    loadCount++;
    if (loadCount === totalImages) {
      BoxFightInit(loadedImages, {});
    }
  };
  loadedImages[key] = img;
}
</script>

<script src="static/js/boxfight.js"></script>

</body>
</html>
